name: CI

# Puerta de calidad del prototipo. Cada push y cada PR ejecuta:
#   - backend: 96 pruebas pytest sobre PostgreSQL real + cobertura >= 90%
#   - frontend: 59 pruebas de interfaz (Vitest) + compilación de producción
# La "CD" la completa Render con autoDeploy sobre main (ver render.yaml).
on:
  push:
    branches: [main, dev, integracion-diseno]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosplay
          POSTGRES_PASSWORD: cosplay
          POSTGRES_DB: cosplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosplay -d cosplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://cosplay:cosplay@localhost:5432/cosplay_test
      TEST_DATABASE_URL: postgresql+asyncpg://cosplay:cosplay@localhost:5432/cosplay_test
      JWT_SECRET: secreto-de-pruebas-con-mas-de-16-caracteres
      FRONTEND_URL: http://localhost:5173
      STORAGE_BACKEND: local
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # conftest.py recrea el esquema con la misma migración de Alembic que
      # producción y vacía las tablas antes de cada prueba. Nunca toca la base
      # de desarrollo. coverage usa el núcleo sysmon (pyproject.toml) porque
      # el trazador C pierde las líneas posteriores a un `await`.
      - name: Pruebas y cobertura
        run: >-
          python -m pytest -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Guardar informe de cobertura
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend · pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Pruebas de interfaz (Vitest)
        run: npm test

      - name: Compilación de producción
        run: npm run build

      - name: Guardar bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-frontend
          path: frontend/dist/
          if-no-files-found: error

  puerta_de_calidad:
    name: Puerta de calidad previa al despliegue
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::La puerta de calidad no pasó. No se debe desplegar."
            exit 1
          fi
          echo "Backend (96 pruebas, >=90% cobertura) y frontend (59 pruebas + build) en verde." >> "$GITHUB_STEP_SUMMARY"
          echo "Render desplegará main automáticamente." >> "$GITHUB_STEP_SUMMARY"
