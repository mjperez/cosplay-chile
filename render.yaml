services:
  - type: web
    name: cosplay-chile-api
    runtime: python
    rootDir: backend
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: BCRYPT_ROUNDS
        value: 12
      # Se cargan a mano en el panel: el repositorio no contiene credenciales.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
