services:
  # --- Backend ---------------------------------------------------------
  - type: web
    name: cosplay-chile-api
    runtime: python
    rootDir: backend
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Las semillas van después de las migraciones y son idempotentes: cargan
    # las 5 categorías y las 20 fichas reales del directorio. Sin ellas el
    # directorio sale vacío y el editor de contenido no puede crear borradores.
    # DEMO_SEED=1 es optativo y solo para exponer la plataforma en clases:
    # crea cuentas y contenido de ejemplo. Quitar la variable y redesplegar
    # deja de ejecutarlo; las filas ya creadas hay que borrarlas a mano.
    startCommand: alembic upgrade head && python -m app.seed.datos_base && if [ "$DEMO_SEED" = "1" ]; then python -m app.seed.demo; fi && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: BCRYPT_ROUNDS
        value: 12
      # Se cargan a mano en el panel: el repositorio no contiene credenciales.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # URL pública del frontend. Sin esto, el navegador bloquea las peticiones
      # por CORS en producción.
      - key: CORS_ORIGINS
        sync: false

  # --- Frontend --------------------------------------------------------
  # Sitio estático: Render compila con Vite y publica dist/. No ejecuta
  # Python ni Node en producción, solo sirve archivos.
  - type: web
    name: cosplay-chile-web
    runtime: static
    rootDir: frontend
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # URL pública del backend, compilada dentro del bundle.
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router maneja las rutas en el cliente. Sin esta reescritura,
      # recargar /directorio devolvería 404 en el servidor.
      - type: rewrite
        source: /*
        destination: /index.html
