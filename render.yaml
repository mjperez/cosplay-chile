services:
  # --- API (FastAPI async + PostgreSQL) ---------------------------------
  - type: web
    name: cosplay-chile-api
    runtime: python
    rootDir: backend
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # La migración crea unaccent/pg_trgm; el seed es idempotente y solo carga
    # datos si la base está vacía. MEDIA_DIR apunta a /tmp porque el plan free
    # tiene disco efímero: para persistir imágenes, usar Cloudinary.
    startCommand: >-
      alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRA_MINUTOS
        value: 60
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGENES_EXTRA
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: MEDIA_DIR
        value: /tmp/cosplay-media

  # --- Frontend (sitio estático) ---------------------------------------
  - type: web
    name: cosplay-chile-web
    runtime: static
    rootDir: frontend
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # URL pública de la API. El cliente la usa para /api y para convertir
      # las rutas /media/... que devuelve la API en URL absolutas.
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router maneja las rutas en el cliente.
      - type: rewrite
        source: /*
        destination: /index.html
