[project]
name = "cosplaychile-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

# El trazador C de coverage pierde las líneas posteriores a un `await` en
# corrutinas; sysmon (Python 3.12+) mide la cobertura real del código async.
[tool.coverage.run]
core = "sysmon"
